name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "backend[dev]"
      - run: pip install -e worker
      - run: ruff check backend worker scripts
      - run: pytest -q backend/tests --cov=app --cov-report=term-missing --cov-fail-under=45
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  deployment-scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Linux deployment scripts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n deploy-linux.sh start-linux.sh scripts/deploy.sh scripts/start.sh
          bash scripts/deploy.sh --prepare-only >/dev/null
          ! grep -Eq '^(JWT_SECRET|INITIAL_ADMIN_PASSWORD|MINIO_ACCESS_KEY|MINIO_SECRET_KEY)=replace-' .env
          before="$(sha256sum .env | cut -d ' ' -f 1)"
          bash scripts/deploy.sh --prepare-only >/dev/null
          test "$before" = "$(sha256sum .env | cut -d ' ' -f 1)"
      - name: Validate Windows deployment scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          foreach ($path in @('scripts/deploy.ps1', 'scripts/start.ps1')) {
            [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          .\scripts\deploy.ps1 -PrepareOnly *> $null
          $content = Get-Content .env -Raw
          if ($content -match '(?m)^(JWT_SECRET|INITIAL_ADMIN_PASSWORD|MINIO_ACCESS_KEY|MINIO_SECRET_KEY)=replace-') {
            throw 'Deployment credentials were not generated.'
          }
          $before = (Get-FileHash .env -Algorithm SHA256).Hash
          .\scripts\deploy.ps1 -PrepareOnly *> $null
          if ($before -ne (Get-FileHash .env -Algorithm SHA256).Hash) {
            throw 'Existing .env was overwritten.'
          }

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/api.Dockerfile -t cv-archive-api:ci .
      - run: docker build -f deploy/worker.Dockerfile -t cv-archive-worker:ci .
      - run: docker build -f deploy/frontend.Dockerfile -t cv-archive-frontend:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cv-archive-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cv-archive-worker:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cv-archive-frontend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
